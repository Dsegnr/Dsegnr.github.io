<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-label="2025.09 至 2026.09 里程碑">
  <defs>
    <style>
      .rise{animation:rise .55s cubic-bezier(.22,.61,.36,1) both}
      @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      .nd{animation:pop .5s cubic-bezier(.22,.61,.36,1) both}
      @keyframes pop{from{opacity:0;transform:scale(.35)}to{opacity:1;transform:scale(1)}}
      .rail{animation:grow 1.6s cubic-bezier(.22,.61,.36,1) .1s both;transform-origin:105px 111px}
      @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      .comet{animation:slide 5.7s linear 1.8s infinite}
      @keyframes slide{from{transform:translateX(0)}to{transform:translateX(950px)}}
      .np{opacity:0;animation:nodeRipple 5.7s cubic-bezier(.2,.55,.45,1) infinite}
      @keyframes nodeRipple{0%{transform:scale(.85);opacity:.5}15%{transform:scale(3);opacity:0}100%{transform:scale(3);opacity:0}}
      .glow{animation:breathe 7s ease-in-out infinite}
      @keyframes breathe{0%,100%{opacity:.78}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.rise,.nd,.rail,.comet,.np,.glow{animation:none}}
    </style>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111820"/><stop offset="1" stop-color="#0B0F12"/>
    </linearGradient>
    <linearGradient id="prog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2B705" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F2B705" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="cometGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2B705" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#FFE9A6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F2B705" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="railClip"><rect x="105" y="98" width="990" height="26"/></clipPath>
  </defs>

  <rect width="1200" height="350" rx="8" fill="url(#tbg)"/>
  <rect x="0.5" y="0.5" width="1199" height="349" rx="8" fill="none" stroke="#212B31"/>
  <rect x="26" y="22" width="4" height="15" rx="2" fill="#F2B705"/>
  <text x="40" y="35" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Segoe UI,sans-serif" font-size="14.5" fill="#EDF1F2">时间线</text>
  <text x="98" y="35" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Segoe UI,sans-serif" font-size="12.5" fill="#5A666C">2025 — 2026</text>
  <text x="1174" y="35" text-anchor="end" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Segoe UI,sans-serif" font-size="11.5" fill="#5A666C">6 个成长节点</text>

  <line x1="105" y1="110.5" x2="1095" y2="110.5" stroke="#212B31" stroke-width="1.5"/>
  <rect class="rail" x="125" y="109" width="950" height="3" rx="1.5" fill="url(#prog)"/>
  <circle class="glow" cx="1075" cy="110.5" r="17" fill="#F2B705" fill-opacity="0.08"/>
  <g clip-path="url(#railClip)" aria-hidden="true">
    <rect class="comet" x="99" y="108" width="52" height="5" rx="2.5" fill="url(#cometGrad)"/>
